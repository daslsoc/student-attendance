# Dependabot version updates. Security updates are enabled separately in
# repo Settings > Code security. Minor+patch bumps are grouped into one weekly
# PR per ecosystem so CI runs once; majors arrive as individual PRs for review.
# Ecosystem blocks are appended by rollout.sh based on what the repo contains.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
