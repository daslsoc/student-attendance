# SonarQube scanner config — local server at http://localhost:9000
# (stack lives in ~/workspace/sonarqube). Run it with `make sonar`, which
# builds coverage first and passes the token through the environment
# (SONAR_TOKEN) — nothing secret lives in this file, so it is tracked.
sonar.projectKey=student-attendance
sonar.projectName=student-attendance
sonar.sourceEncoding=UTF-8

# Everything we ship, PHP + JS + Blade. public/ is build output, vendor/
# and node_modules/ are third-party — not listed, so not scanned.
sonar.sources=app,config,database,routes,resources/js,resources/views
sonar.tests=tests
sonar.test.exclusions=tests/coverage/**,tests/js-coverage/**,tests/clover.xml

# Rule exceptions we have decided on, with the reason. Prefer fixing code
# over adding to this list.
sonar.issue.ignore.multicriteria=cfg1,cfg2,seed1,seed2,returns1,mig1
# Framework config and seed data repeat literals by nature; a constant per
# repeated string would make them less readable, not more.
sonar.issue.ignore.multicriteria.cfg1.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.cfg1.resourceKey=config/**
sonar.issue.ignore.multicriteria.seed1.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.seed1.resourceKey=database/seeders/**
sonar.issue.ignore.multicriteria.seed2.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.seed2.resourceKey=database/factories/**
# config/database.php is Laravel's stock skeleton; it stays identical to
# upstream so framework upgrades diff cleanly.
sonar.issue.ignore.multicriteria.cfg2.ruleKey=php:S3358
sonar.issue.ignore.multicriteria.cfg2.resourceKey=config/database.php
# Early-return guard clauses are the house style; the "at most three
# returns" rule fights it without making anything clearer.
sonar.issue.ignore.multicriteria.returns1.ruleKey=php:S1142
sonar.issue.ignore.multicriteria.returns1.resourceKey=**/*.php
# Migrations throw a plain RuntimeException when a precondition fails —
# the message is the point, a dedicated class adds nothing.
sonar.issue.ignore.multicriteria.mig1.ruleKey=php:S112
sonar.issue.ignore.multicriteria.mig1.resourceKey=database/migrations/**

# Coverage: PHPUnit clover (XDEBUG_MODE=coverage) and Vitest lcov, both
# regenerated by `make sonar`.
sonar.php.coverage.reportPaths=tests/clover.xml
sonar.javascript.lcov.reportPaths=tests/js-coverage/lcov.info
